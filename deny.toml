# cargo-deny: what the dependency graph may contain (CONTRIBUTING.md,
# "Dependencies").

[graph]
all-features = true

[advisories]
yanked = "deny"
# chrono, unmaintained with no safe version (RUSTSEC-2026-0543), comes only
# through rmcp, the MCP SDK behind roomkit-mcp: ignored until rmcp leaves it.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono, through rmcp only; no safe version; until rmcp drops it" },
]

[licenses]
# A license joins this list in the change that adds the dependency needing it.
allow = [
    "MIT",
    # unicode-ident, behind serde's and thiserror's derive macros; the icu
    # crates, behind reqwest's URL parsing (roomkit-mcp's HTTP backend).
    "Unicode-3.0",
    # The HTTP client of roomkit-mcp's HTTP backend: ring (Apache-2.0 AND
    # ISC), sync_wrapper, and ryu (Apache-2.0 OR BSL-1.0).
    "Apache-2.0",
    # ring, rustls-webpki and untrusted, behind rustls.
    "ISC",
    # subtle, behind rustls.
    "BSD-3-Clause",
    # webpki-roots, the root certificates rustls checks a server against.
    "CDLA-Permissive-2.0",
    # foldhash, a hasher behind serde_json.
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
