[package]
name = "roomkit-examples"
description = "Runnable examples of RoomKit for Rust, each checking what it shows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# What the examples share besides the roomkit calls each one shows. A library
# target compiles once for all of them, and each example imports what it uses.
[lib]
name = "shared"
path = "shared/lib.rs"

[dependencies]
roomkit.workspace = true
roomkit-ai.workspace = true
roomkit-openai.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fake of the OpenAI wire (shared/openai.rs) is a local HTTP server.
tokio = { workspace = true, features = ["net", "io-util"] }

# The server example's (server_agent.rs), which the shared library does not
# use: its store, its WebSocket server and the client its checks connect
# with, and the signal that stops it when it serves.
[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
roomkit-sqlite.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true

# One file per example, run from the repository root with
# `cargo run --example <name>`. `make examples` runs every file of this
# directory, so an example missing here fails the gate.

# The RFC's Appendix B flows.

[[example]]
name = "echo_room"
path = "echo_room.rs"

[[example]]
name = "new_conversation"
path = "new_conversation.rs"

[[example]]
name = "block_and_inject"
path = "block_and_inject.rs"

[[example]]
