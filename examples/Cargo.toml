[package]
name = "roomkit-examples"
description = "Runnable examples of RoomKit for Rust, each checking what it shows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# What the examples share besides the roomkit calls each one shows. A library
# target compiles once for all of them, and each example imports what it uses.
[lib]
name = "shared"
path = "shared/lib.rs"

[dependencies]
roomkit.workspace = true
roomkit-ai.workspace = true
roomkit-openai.workspace = true
roomkit-anthropic.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fake of the OpenAI wire (shared/openai.rs) is a local HTTP server.
tokio = { workspace = true, features = ["net", "io-util"] }
# The server the server examples run (shared/server.rs): its WebSocket
# server, the socket's two directions and the error of a message over its
# limit, and its store, on which the skills example (agent_skills.rs)
# restarts as well. The server examples' checks connect with
# tokio-tungstenite's client.
axum.workspace = true
futures-util.workspace = true
roomkit-sqlite.workspace = true
tokio-tungstenite.workspace = true

# What the shared library does not use: the signal that stops a server
# example when it serves, and the process the web chat's check reads its
# page's script with (web_chat.rs, `node --check`).
[dev-dependencies]
# The MCP example's (mcp_tools.rs), which starts itself as its MCP server.
roomkit-mcp.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }

[lints]
workspace = true

# One file per example, run from the repository root with
# `cargo run --example <name>`. `make examples` runs every file of this
# directory, so an example missing here fails the gate.

# The RFC's Appendix B flows.

