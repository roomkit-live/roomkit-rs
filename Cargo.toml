[workspace]
resolver = "3"
members = ["crates/*", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/roomkit-live/roomkit-rs"
# Nothing is published before the first usable step.
publish = false

[workspace.dependencies]
roomkit = { path = "crates/roomkit" }
roomkit-ai = { path = "crates/roomkit-ai" }
roomkit-core = { path = "crates/roomkit-core" }
roomkit-mcp = { path = "crates/roomkit-mcp" }
roomkit-openai = { path = "crates/roomkit-openai" }
roomkit-sqlite = { path = "crates/roomkit-sqlite" }

# The `Stream` an AI provider's response is read as (step 4, decision 11),
# with no default features: the trait alone.
# MCP's client over stdio (step 4, decisions 11 and 12), for roomkit-mcp
# alone: its minor version pinned, and moved on purpose.
rmcp = { version = "~3.8", default-features = false, features = ["client", "transport-async-rw"] }
# The signal roomkit-mcp stops an MCP server's process group with, on Unix
# (killpg, without unsafe code here): its minor version pinned.
nix = { version = "~0.31", default-features = false, features = ["signal"] }
futures-core = { version = "0.3", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["alloc"] }
# The OpenAI agent's HTTP client (step 4, decision 4): rustls with its ring
# provider and the webpki roots, so no system TLS library is needed, and no
# HTTP/2, proxy or charset support, which a Chat Completions call does not
# need. 0.13 has no ring-backed rustls feature.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

pretty_assertions = "1"
# Property tests (decision 3 of step 2b). No default features: no forking
# test runner, no regex strategies. Each property test turns off the
# persistence of failing cases, which a failing test prints instead.
proptest = { version = "1", default-features = false, features = ["std"] }
# The SQLite store (decision 4 of step 4): the SQLite library compiled in,
# with the JSON functions and the full-text index of the Python
# implementation's schema.
rusqlite = { version = "0.41", features = ["bundled"] }
# The server example's (decision 4 of step 4), development only: axum's
# WebSocket server over HTTP/1, the client its checks connect with, without
# TLS, both on the tungstenite axum uses, and the combinators that split a
# socket into its two directions.
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Module paths already name the domain (`hook_chain::Outcome` reads better than
# `hook_chain::HookChainOutcome`), and `#[must_use]` is put where ignoring a
# value is a bug rather than on every pure function.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Library code never panics on input: no unwrap, expect, panic, indexing or
# string slicing outside tests (clippy.toml allows them in tests).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
# Output goes through `tracing`; examples opt out explicitly.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A silenced lint states why, and `expect` fails once the reason is gone.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Adding a variant to an RFC enumeration must force every match to decide.
wildcard_enum_match_arm = "warn"
clone_on_ref_ptr = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
bare_urls = "warn"
