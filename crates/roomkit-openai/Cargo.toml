[package]
name = "roomkit-openai"
description = "An AI agent channel for RoomKit, answering through an OpenAI-compatible Chat Completions endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
roomkit-provider-http.workspace = true
roomkit.workspace = true
# The transcript the wire is written from (`transcript::Message`), which
# roomkit keeps private as Python does (step 5, decision 16) until lot 5
# turns it into the agent's `AiMessage`.
roomkit-core.workspace = true
# The provider-neutral AI channel and its tool loop (step 4, decision 6).
roomkit-ai.workspace = true
# The `Stream` a streamed completion is read as (step 4, decision 11).
futures-core.workspace = true
# An HTTP date an endpoint's `Retry-After` names, as Python's SDK reads it;
# already in the tree through roomkit-core.
jiff.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The one warning of an effort a turn with tools left out unsaid (RFC
# §6.7), as Python's; already in the tree through roomkit.
tracing.workspace = true
# The wait between two tries of a request (`OpenAiConfig::max_retries`);
# already in the tree through roomkit-ai.
tokio.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# gzip, as a host that also links roomkit-tools enables it: the requests must
# still ask for uncompressed answers.
reqwest = { workspace = true, features = ["gzip"] }
serde_json.workspace = true
# The fake of the OpenAI wire the tests run against: a local HTTP server.
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
