[package]
name = "roomkit-sqlite"
description = "A SQLite conversation store for RoomKit, on the Python implementation's schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
roomkit.workspace = true
roomkit-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The warning of a record the model cannot read (HITL 2e66d6ef).
tracing.workspace = true

[dev-dependencies]
# The conformance runner's paced model, which the suite includes from
# roomkit.
futures-core.workspace = true
pretty_assertions.workspace = true
# The conformance runner's scripted agent, which the suite includes from
# roomkit.
roomkit-ai.workspace = true
# The conformance runner's scripted ACP agent, which the suite includes
# from roomkit.
roomkit-acp.workspace = true
# The conformance runner's `chat_dialect`, which the suite includes from
# roomkit: a request written to a local server (`net`, `io-util`).
roomkit-openai.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# The fixture's fingerprint (tests/cross_read.rs).
sha2.workspace = true
# The conformance runner's, which the suite includes from roomkit.
uuid.workspace = true

[lints]
workspace = true
