[package]
name = "roomkit-core"
description = "The sans-IO core of RoomKit: data model, rules and pipeline operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Behind `Timestamp` only, so its version never reaches the public API. No
# default features, which read the system time zone, and no `std`, whose
# `Timestamp::now` reads the system clock (scripts/check-core-deps.sh).
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
# The fingerprint of an instruction its responses carry (RFC §10.1.1 rule
# 6). No default features: the standard library is not needed for a hash.
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The random ids of the system environment, behind `system-environment`.
uuid = { workspace = true, optional = true }

[features]
# The model's filling constructors (`RoomEvent::new`, `Room::new`, ...),
# which take an id and an instant from the system clock and random ids, as
# the Python implementation's model defaults do (docs/steps/step-05.md, lot
# 2). Off by default: the core's operations build their records from their
# `Environment` and never read the clock; `roomkit` turns it on.
system-environment = ["dep:uuid"]

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true

[lints]
workspace = true
