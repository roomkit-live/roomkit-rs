[package]
name = "roomkit"
description = "RoomKit for Rust: multi-channel conversations with rooms, hooks and permissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The model's filling constructors, which read the system clock (step 5,
# lot 2).
roomkit-core = { workspace = true, features = ["system-environment"] }
# The `Stream` a turn's response and a streaming delivery are read as (step
# 4, decision 11).
futures-core.workspace = true
# The messages of the turn backend (RFC §10.6.3), in the serialized form
# of RFC §1.4; already the core's.
serde.workspace = true
# A tool call's result as its hooks read it (RFC §9.3), a JSON value; the
# turn backend's messages, serialized and parsed.
serde_json.workspace = true
# A verification request's secret and its hash (RFC §11.7.7), as the
# Python implementation draws and hashes them.
getrandom.workspace = true
# A session audit's transcript shows each instant in the machine's time
# zone, as Python's `astimezone()` (RFC §15.8.2): the zone of `TZ` or of
# /etc/localtime, read from the system's zoneinfo.
jiff = { workspace = true, features = ["std", "tz-system", "tzdb-zoneinfo"] }
scrypt.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }

# Python's extra `roomkit[opentelemetry]`: `telemetry::OpenTelemetryProvider`.
[features]
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk"]

[dev-dependencies]
pretty_assertions.workspace = true
# The conformance runner's scripted agent (roomkit-specs conformance/README.md,
# "Scripted agents"): roomkit-ai's AI channel over a scripted model.
roomkit-ai.workspace = true
# The conformance runner's scripted ACP agent (roomkit-specs
# conformance/README.md, "Scripted ACP agents"): roomkit-acp's channel over
# a transport of the runner's own.
roomkit-acp.workspace = true
# The conformance runner's `chat_dialect`: a request written through the Chat
# Completions rendering, to a local server (`net`, `io-util`).
roomkit-openai.workspace = true
roomkit-anthropic.workspace = true
sha2.workspace = true
# The turn backend's liveness, tested on tokio's paused clock.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
# The in-memory exporter the `opentelemetry` feature's tests read.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
