# How roomkit-rs's public API maps to the Python implementation's
# (api/PYTHON_API.md), read by
# scripts/api-parity.py (`make api-parity`) against the snapshot pinned in
# api/python/.
#
# The rules below apply with no entry; scripts/api-parity.py's docstring says
# what each one does. The entries cover what a rule does not give:
# - [[map]]: the Python counterpart of a Rust item or member, `params` its
#   parameters' Python names, `py_spec` the hash of the Python spec it was
#   written against (`scripts/api-parity.py --spec NAME`);
# - [[exception]]: a Rust form the architecture table approves, with its date
#   and reason; a dated one names in `until` the Python name whose arrival
#   ends it, and the report lists it as due once the snapshot holds it;
# - [[missing]]: a Python name of a class in scope that Rust lacks, not in
#   0.x, with its reason and its `scope`: `text`, the side the API work drives
#   to zero; `media`, voice, video, realtime, recording, vision, conferences
#   and a voice or video session; `tier1b`, what RMK-1544 lists (transport
#   providers, other AI providers' extras, sources, the WebSocket and webhook
#   helpers, injected HTTP transports, protocol traces). A Python private
#   name, or a form the language forces (a reason "language: ..."), is no
#   gap: an [[exception]] holds it, with its row in the names table;
# - [[pending]]: a known difference not removed yet, with the lot of step 5
#   that removes it ("?" while the plan names none). Lot 6 requires none left.
# An entry names a `rust` or a `python` path and some of its `members` or
# `params` (`roomkit::RoomKit::attach`, `roomkit.RoomKit.attach_channel(category)`),
# or a whole Rust item, which covers that item's own finding alone ("no Python
# name", or a struct a caller builds keeping `#[non_exhaustive]`) and goes dead
# once the item maps and builds. A whole Python class is no entry.

[rules]
# Rust's casing of an acronym in a type's name (rust-lang RFC 430).
acronyms = { Ai = "AI", OpenAi = "OpenAI", Mcp = "MCP", Acp = "ACP", Sqlite = "SQLite", Jsonl = "JSONL" }
# What a `Duration` drops from a Python name (decision 3).
duration_suffix = "_seconds"
# The error variants a Python builtin exception stands for (convention 5),
# by the variant's path, the variant the builtin's name without `Error`;
# `ExceptionGroup` the answer of a close whose channels failed (decided
# 2026-10-29).
builtin_errors = { "roomkit::RoomKitError::Value" = "ValueError", "roomkit::RoomKitError::Cancelled" = "asyncio.CancelledError", "roomkit::RoomKitError::ExceptionGroup" = "ExceptionGroup", "roomkit::RoomKitError::Timeout" = "TimeoutError", "roomkit::RoomKitError::Runtime" = "RuntimeError", "roomkit::StoreError::Value" = "ValueError", "roomkit::RoomKitError::Type" = "TypeError" }
# The variants carrying a builtin that stand for Python's value of it, no
# member: Python's visibility naming channels is a comma-joined `str`.
builtin_payloads = ["roomkit::model::Visibility::Channels"]

# The Python packages a Rust module's items are looked for in, in order. A
# module not listed takes its closest listed parent's.
[rules.packages]
roomkit = ["roomkit"]
"roomkit::model" = ["roomkit", "roomkit.models"]
"roomkit::testing" = ["roomkit.testing"]
"roomkit::tools" = ["roomkit.tools"]
roomkit_ai = ["roomkit.providers.ai", "roomkit", "roomkit.tools", "roomkit.skills"]
"roomkit_ai::memory" = ["roomkit.memory", "roomkit"]
"roomkit_ai::knowledge" = ["roomkit.knowledge"]
roomkit_openai = ["roomkit.providers.openai"]
roomkit_anthropic = ["roomkit.providers.anthropic"]
"roomkit_openai::deepseek" = ["roomkit.providers.deepseek"]
"roomkit_openai::minimax" = ["roomkit.providers.minimax"]
"roomkit_openai::kimi" = ["roomkit.providers.kimi"]
roomkit_mcp = ["roomkit.tools"]
roomkit_acp = ["roomkit"]
roomkit_sqlite = ["roomkit", "roomkit.store"]
roomkit_postgres = ["roomkit.store", "roomkit.knowledge"]
"roomkit::realtime" = ["roomkit.realtime"]
"roomkit::providers::sms" = ["roomkit.providers.sms"]
"roomkit::delivery" = ["roomkit.delivery", "roomkit"]
"roomkit::orchestration" = ["roomkit.orchestration"]
"roomkit::orchestration::strategies" = ["roomkit.orchestration.strategies"]
"roomkit::orchestration::strategies::supervisor" = ["roomkit.orchestration.strategies.supervisor"]
"roomkit::orchestration::strategies::discussion" = ["roomkit.orchestration.strategies.discussion"]
"roomkit::identity" = ["roomkit.identity"]
"roomkit::tasks" = ["roomkit.tasks"]
"roomkit::telemetry" = ["roomkit.telemetry"]
"roomkit_ai::tasks" = ["roomkit.tasks"]
"roomkit_ai::orchestration" = ["roomkit.orchestration"]

# The Rust types a Python builtin stands for (decision 4; the architecture
# table's "Types and values" and "Errors"), by path: the strong ids, values
# and maps, the errors a validator raises, and the aliases of what a channel
# or a router raises, Python's `Exception`. A type's `members` are those the
# architecture table maps to the builtin's operations (`str(id)` is
# `as_str()`); any other member is a finding. An error's variants are the
# messages of the exception it stands for.
[rules.builtins]
"roomkit::ChannelError" = { python = "Exception" }
"roomkit::RouterError" = { python = "Exception" }
"roomkit::identity::IdentityError" = { python = "Exception" }
# A dispatch policy's raise (HITL 7a38cb9c).
"roomkit::orchestration::DispatchError" = { python = "Exception" }
"roomkit::DeliveryBackendError" = { python = "Exception" }
"roomkit::model::RoomId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::EventId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::ChannelId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::ParticipantId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::IdentityId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::TaskId" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::ObservationId" = { python = "str", members = ["new", "as_str"] }
"roomkit::CountryCode" = { python = "str", members = ["new", "as_str"] }
"roomkit::model::ChannelSet" = { python = "str", members = ["new", "contains", "iter"] }
"roomkit::model::Timestamp" = { python = "datetime", members = ["from_unix_millis", "as_unix_millis", "checked_add", "duration_since", "UNIX_EPOCH"] }
# A model price's day, Python's `datetime.date` (HITL 656a0dca).
"roomkit_ai::Date" = { python = "date", members = ["new", "year", "month", "day"] }
"roomkit::model::Metadata" = { python = "dict" }
"roomkit::model::Confidence" = { python = "float", members = ["new", "value", "FULL"] }
"roomkit::model::Latitude" = { python = "float", members = ["new", "degrees"] }
"roomkit::model::Longitude" = { python = "float", members = ["new", "degrees"] }
"roomkit::model::ModelError" = { python = "ValueError" }
"roomkit::InvalidCountryCode" = { python = "ValueError" }
# An AI channel's and a tool definition's refusal, Python's constructors'
# `ValueError` (a tool name two tools take, `ToolNameCollisionError`, is one).
"roomkit_ai::AiError" = { python = "ValueError" }
# Python's streams (decision 12, the architecture table's "Channels"):
# `deliver_stream`'s `text_stream`, an `AsyncIterator[str]` whose items are
# the text and the response's rows, which its annotation does not name, and
# `ChannelOutput.response_stream`, an `AsyncIterator` of text and markers,
# `ResponseItem`'s `Text`, `Thinking` (`roomkit.models.ThinkingDeltaMarker`,
# as `StreamItem`'s), `Usage(UsageMarker)` and `LoopEnd(LoopEndMarker)`, Python's private
# tool markers hidden. Rust names the stream types and their items;
# `next()` is `__anext__`.
"roomkit::DeliveryStream" = { python = "AsyncIterator", members = ["next", "cut"] }
"roomkit::ResponseStream" = { python = "AsyncIterator" }
"roomkit::StreamItem" = { python = "str" }
"roomkit::ResponseItem" = { python = "str" }
# A provider's `generate_stream`, an `AsyncIterator[str]`, and a message's
# content, `str | list[part]`, which Rust tells apart as its two variants.
"roomkit_ai::TextStream" = { python = "AsyncIterator" }
"roomkit_ai::AiMessageContent" = { python = "str" }

# The Rust enums a Python `Literal` stands for, by path: the field it types
# (decision 4; a nameless literal takes its field's name) and the Literal's
# values, read from the Python source (the snapshot holds none), each a
# variant's snake_case name.
[rules.literals]
"roomkit::model::HookAction" = { field = "roomkit.HookResult.__init__(action)", values = ["allow", "block", "modify"] }
"roomkit::model::DeliveryResultStatus" = { field = "roomkit.DeliveryResult.__init__(status)", values = ["sent", "queued", "failed"] }
"roomkit::model::DeliveryOutcomeStatus" = { field = "roomkit.DeliveryOutcome.__init__(status)", values = ["queued", "sent", "blocked", "unavailable", "failed", "unknown"] }
"roomkit::model::RichFormat" = { field = "roomkit.models.RichContent.__init__(format)", values = ["html", "markdown"] }
"roomkit::model::ToolCallStatus" = { field = "roomkit.ToolCallContent.__init__(status)", values = ["pending", "completed", "failed"] }
"roomkit_ai::AiRole" = { field = "roomkit.providers.ai.AIMessage.__init__(role)", values = ["system", "user", "assistant", "tool"] }
"roomkit::model::LoopEndReason" = { field = "roomkit.models.LoopEndMarker.__init__(reason)", values = ["completed", "max_rounds", "timeout", "budget_exceeded", "truncated", "empty_response", "unfinished", "force_stopped", "cancelled", "error"] }
"roomkit_ai::GenerationPurpose" = { field = "roomkit.AIGenerationEvent.__init__(purpose)", values = ["answer", "thought"] }
"roomkit_ai::ToolDeclarationOrigin" = { field = "roomkit.DeclaredTool.__init__(origin)", values = ["always", "pinned", "sticky", "revealed"] }
"roomkit_ai::ResponseSchemaFailure" = { field = "roomkit.ResponseSchemaError.__init__(reason)", values = ["unsupported", "refusal", "truncated", "invalid_json"] }

# The Python exception classes each error enum's variants stand for, by the
# enum's path, read from the Python source (the snapshot holds no class's
# bases; tasks/probes/step5-lot2/error_families.py): a variant's class must
# be listed, and each class listed must have its variant. A class with a
# constructor has its parameters compared; one that takes a message alone
# lists the fields its variant carries, the values its message names (the
# architecture table's "Errors"), a tuple variant's payload by position
# (`0`), as rustdoc names a tuple's fields.
[rules.error_families."roomkit::RoomKitError"]
"roomkit.RoomNotFoundError" = ["0"]
"roomkit.RoomAlreadyExistsError" = ["0"]
"roomkit.RoomClosedError" = ["room_id"]
"roomkit.TransitionRefusedError" = []
"roomkit.ProcessTimeoutError" = ["room_id"]
"roomkit.ChangeRefusedError" = []
"roomkit.ReentrantCallError" = ["room_id"]
"roomkit.ReentryLoopCapError" = ["0"]
"roomkit.ChannelNotFoundError" = ["room_id", "channel_id"]
"roomkit.ChannelNotRegisteredError" = ["channel_id", "message"]
"roomkit.ChannelAlreadyRegisteredError" = ["0"]
"roomkit.ParticipantNotFoundError" = ["room_id", "participant_id", "channel_id", "reached_elsewhere"]
"roomkit.IdentityNotFoundError" = ["0"]
"roomkit.AddressLinkedError" = ["channel_type"]
"roomkit.EventNotFoundError" = ["0"]
"roomkit.HumanInputRejectedError" = ["0"]
"roomkit.ToolNameCollisionError" = ["0"]
"roomkit.VerificationRefusedError" = []
"roomkit.IdempotencyKeyTakenError" = ["room_id", "channel_id", "key"]
"roomkit.ProviderDeliveryError" = []
"roomkit.KitClosedError" = []
"roomkit.ShutdownCancelledError" = []
"roomkit.RemoteTurnError" = []
"roomkit.TurnLinkError" = []

# The store's refusals: the exception classes Python's stores raise, each
# a `RoomKitError` (lot 4, decision 14).
[rules.error_families."roomkit::StoreError"]
"roomkit.RoomAlreadyExistsError" = ["0"]
"roomkit.RoomNotFoundError" = ["0"]
"roomkit.ParticipantExistsError" = ["room_id", "participant_id"]
"roomkit.ParticipantNotFoundError" = ["room_id", "participant_id"]
"roomkit.IdentityNotFoundError" = ["0"]
"roomkit.AddressLinkedError" = ["channel_type"]
"roomkit.EventNotFoundError" = ["0"]
"roomkit.TaskNotFoundError" = ["0"]
"roomkit.IdempotencyKeyTakenError" = ["room_id", "channel_id", "key"]

# Python's messages name the directory and why, the skill and why, the
# skill and the rules it breaks.
[rules.error_families."roomkit_ai::SkillError"]
"roomkit.skills.SkillDiscoveryError" = ["path", "reason"]
"roomkit.skills.SkillParseError" = ["skill", "reason"]
"roomkit.skills.SkillValidationError" = ["skill", "reasons"]
"roomkit.skills.SkillManifestTooLargeError" = []

