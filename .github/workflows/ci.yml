name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The script .githooks/commit-msg runs, for commits made where the hook
      # is not installed. A push that creates the branch has no `before`, so
      # only its head commit is checked.
      - name: Commit messages follow CONTRIBUTING.md
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD_SHA^!"
          else
            range="$BEFORE..$HEAD_SHA"
          fi
          status=0
          for commit in $(git rev-list "$range"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! scripts/check-commit-message.sh "$RUNNER_TEMP/message"; then
              echo "::error::Commit $commit does not follow CONTRIBUTING.md \"Commits\""
              status=1
            fi
          done
          exit "$status"

  checks:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml and caches builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make fmt-check
      - run: make clippy
      - run: make test
      # The core's tests without its default-off features: the
      # system-environment constructors must stay optional.
      - run: make test-core
      - run: make examples
      - run: make doc
      - run: make check-core-deps
      # The pinned Python snapshot's copies match their fingerprint; their
      # roomkit commit's check needs a roomkit checkout, and is skipped here.
      - run: make api-check-pin
      # The tests of the rustdoc reader and of the parity report.
      - run: make api-test

  api-parity:
    name: Public API parity gate
    runs-on: ubuntu-latest
    # The gate before the tag (docs/steps/step-05.md, lot 6): a finding no
    # entry covers, a dead entry or a pending entry fails it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Builds the docs (`make doc`), reads their HTML, and writes the report,
      # the surface and the findings in target/api-parity.
      - run: make api-parity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-parity
          path: target/api-parity/

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The version is the workspace's `rust-version` (Makefile).
      - run: make msrv-toolchain
      - run: make msrv

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
