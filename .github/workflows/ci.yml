name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same rule as .githooks/commit-msg, for commits made where the hook is
      # not installed. A push that creates the branch has no `before`, so only
      # its head commit is checked.
      - name: Commit messages name no downstream application
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD_SHA^!"
          else
            range="$BEFORE..$HEAD_SHA"
          fi
          if git log --format='%h %B' "$range" | grep -inE '\bluge\b|\bLUG-[0-9]+'; then
            echo "::error::Commit messages must not name a downstream application (see CONTRIBUTING.md)"
            exit 1
          fi

  checks:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml and caches builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make fmt-check
      - run: make clippy
      - run: make test
      - run: make doc
      - run: make check-core-deps

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: make msrv

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
