# Tests may unwrap, panic, index and print: a failing test is the point.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Product names read as words in documentation, not as code.
doc-valid-idents = ["RoomKit", "PyO3", "WhatsApp", "OpenAI", "OpenRouter", "DeepSeek", ".."]

# The clock is the operations' environment's (docs/architecture.md, "The
# core"). The core's own clippy.toml (crates/roomkit-core) bans the system
# clocks with the rest of what it never does; this list extends the clock
# ban to the runtime and the examples, where the runtime's system
# environment marks the one read of the wall clock.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "read the time from the Environment" },
    { path = "std::time::Instant::now", reason = "read the time from the Environment" },
]
