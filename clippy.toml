# Tests may unwrap, panic, index and print: a failing test is the point.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# RoomKitError is 128 bytes since a map keeps its members' order, as
# Python's dict does (RMK-1198): its delivery failure carries the provider's
# result whole, metadata included.
large-error-threshold = 136

# Product names read as words in documentation, not as code.
doc-valid-idents = ["RoomKit", "PyO3", "WhatsApp", "OpenAI", "OpenRouter", "DeepSeek", "MiniMax", ".."]

# The clock is the operations' environment's (docs/architecture.md, "The
# core"). The core's own clippy.toml (crates/roomkit-core) bans the system
# clocks with the rest of what it never does; this list extends the clock
# ban to the runtime and the examples, where the runtime's system
# environment marks the one read of the wall clock.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "read the time from the Environment" },
    { path = "std::time::Instant::now", reason = "read the time from the Environment" },
    { path = "serde_json::Map::remove", reason = "swaps the last member into its place: shift_remove keeps the order Python keeps (RMK-1198)" },
    { path = "serde_json::Map::remove_entry", reason = "swaps the last member into its place: shift_remove keeps the order Python keeps (RMK-1198)" },
    { path = "serde_json::map::OccupiedEntry::remove", reason = "swaps the last member into its place: shift_remove keeps the order Python keeps (RMK-1198)" },
    { path = "serde_json::map::OccupiedEntry::remove_entry", reason = "swaps the last member into its place: shift_remove_entry keeps the order Python keeps (RMK-1198)" },
]
